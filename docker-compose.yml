
services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-food-delivery
    restart: unless-stopped
    environment:
      POSTGRES_DB: deliverydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deliverydb"]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile # looks for Dockerfile in user-service folder
    container_name: user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"              # different external port
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deliverydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8082          # important — matches internal port
      SPRING_APPLICATION_NAME: user-service

  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile # looks for Dockerfile in restaurant-service folder
    container_name: restaurant-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"              # different external port
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deliverydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8083          # important — matches internal port
      SPRING_APPLICATION_NAME: restaurant-service

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile # looks for Dockerfile in user-service folder
    container_name: order-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"              # different external port
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deliverydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8084         # important — matches internal port
      SPRING_APPLICATION_NAME: order-service

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile # looks for Dockerfile in user-service folder
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"              # different external port
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deliverydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8085         # important — matches internal port
      SPRING_APPLICATION_NAME: auth-service

volumes:
  pgdata: