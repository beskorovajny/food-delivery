server:
  port: 8083   # different from user-service (8082)

spring:
  application:
    name: restaurant-service   # must be unique per service

  datasource:
    url: jdbc:postgresql://postgres:5432/deliverydb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

    hikari:
      connection-timeout: 30000           # 30s
      validation-timeout: 5000
      maximum-pool-size: 10               # can be 5–15 depending on expected load
      idle-timeout: 300000                # 5 min
      initialization-fail-timeout: 0
      connection-test-query: SELECT 1     # forces early pool init

  sql:
    init:
      mode: always                        # run schema.sql & data.sql on every startup (dev)
      platform: postgresql
      continue-on-error: false
      schema-locations:
        - classpath:db/schema.sql
      data-locations:
        - classpath:db/data.sql

  jpa:
    hibernate:
      ddl-auto: none                      # very important — we use sql init
    show-sql: true
    properties:
      hibernate:
        format_sql: true