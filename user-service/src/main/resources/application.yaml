server:
  port: 8082   # different from others

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://postgres:5432/deliverydb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver


    hikari:
      connection-timeout: 30000           # 30s
      validation-timeout: 5000
      maximum-pool-size: 10
      idle-timeout: 300000                # 5 min
      initialization-fail-timeout: 0
      connection-test-query: SELECT 1

  sql:
    init:
      mode: always
      platform: postgresql       # optional, but good to specify
      continue-on-error: false   # fail fast on error
      schema-locations: # custom locations if you don't want default
          - classpath:db/schema.sql
      data-locations:
          - classpath:db/data.sql

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
        hibernate:
          format_sql: true



logging:
  level:
    root: INFO
    com.delivery.food: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # shows ? = value bindings

  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/${spring.application.name}.log
    max-history: 7
    max-size: 10MB