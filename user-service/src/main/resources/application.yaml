server:
  port: 8082   # different from others

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://postgres:5432/deliverydb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver


    hikari:
      connection-timeout: 30000           # 30s
      validation-timeout: 5000
      maximum-pool-size: 10
      idle-timeout: 300000                # 5 min
      initialization-fail-timeout: 0
      connection-test-query: SELECT 1

  sql:
    init:
      mode: always
      platform: postgresql       # optional, but good to specify
      continue-on-error: false   # fail fast on error
      schema-locations: # custom locations if you don't want default
          - classpath:db/schema.sql
      data-locations:
          - classpath:db/data.sql

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
        hibernate:
          format_sql: true


  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    table: flyway_schema_history
    # Add these for debug & early init
    baseline-description: "Initial baseline"
    connect-retries: 60
    connect-retries-interval: 1000
    init-sqls: SELECT 1  # forces datasource test early

    logging:
      level:
        org.flywaydb: TRACE  # maximum debug — will show if Flyway starts at all
        org.springframework.boot.autoconfigure.flyway: TRACE